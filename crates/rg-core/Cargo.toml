[package]
name = "rg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-segment resumable HTTP download engine (IDM-style), clean-room implementation"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
thiserror = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
