[package]
name = "rg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end for the RapidGrab engine"

[[bin]]
name = "rapidgrab"
path = "src/main.rs"

[[bin]]
name = "rapidgrab-host"
path = "src/host.rs"

[[bin]]
name = "rapidgrab-popup"
path = "src/popup.rs"

[dependencies]
rg-core = { path = "../rg-core" }
rg-resolve = { path = "../rg-resolve" }
rg-bridge = { path = "../rg-bridge" }
rg-config = { path = "../rg-config" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4" }
dirs = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winnt", "handleapi", "synchapi"] }
