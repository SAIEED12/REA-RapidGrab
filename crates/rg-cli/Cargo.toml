[package]
name = "rg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end for the RapidGrab engine"

[[bin]]
name = "rapidgrab"
path = "src/main.rs"

[dependencies]
rg-core = { path = "../rg-core" }
rg-resolve = { path = "../rg-resolve" }
rg-bridge = { path = "../rg-bridge" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
