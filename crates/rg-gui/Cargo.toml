[package]
name = "rg-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui-based GUI for RapidGrab"

[[bin]]
name = "rapidgrab-gui"
path = "src/main.rs"

[dependencies]
rg-core = { path = "../rg-core" }
rg-resolve = { path = "../rg-resolve" }
rg-bridge = { path = "../rg-bridge" }
rg-config = { path = "../rg-config" }
rg-grab = { path = "../rg-grab" }
egui = { version = "0.37", features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rfd = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
open = "5"
tracing-appender = "0.2"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
